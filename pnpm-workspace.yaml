packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 12 quarantines packages published in the last 24 hours, which is a real
# defence against a compromised maintainer — most malicious publishes are
# yanked within hours. This repo opts out because its policy is the latest
# stable of everything, and that collides with the quarantine on the day a
# release lands.
#
# The trade this makes explicit: we rely on the lockfile being reviewed and on
# CI running `--frozen-lockfile`, not on a waiting period. If that stops being
# true, raise this to 1440 rather than leaving it at zero and hoping.
minimumReleaseAge: 0

catalog:
  # React
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Build
  vite: 8.3.1
  '@vitejs/plugin-react': 6.1.1
  typescript: 7.0.2

  # Styling
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  lucide-react: 1.48.0
  radix-ui: 1.6.7
  motion: 13.4.6

  # State / data
  zustand: 5.0.15
  '@tanstack/react-virtual': 3.14.13

  # UI extras
  sonner: 2.0.8
  qrcode.react: 4.2.0

  # i18n
  i18next: 26.4.2
  react-i18next: 17.0.15

  # Tauri
  '@tauri-apps/api': 2.12.0
  '@tauri-apps/cli': 2.12.0
  '@tauri-apps/plugin-updater': 2.13.0
  '@tauri-apps/plugin-process': 2.4.0
  '@tauri-apps/plugin-autostart': 2.6.0
  '@tauri-apps/plugin-notification': 2.5.0
  '@tauri-apps/plugin-store': 2.5.0
  '@tauri-apps/plugin-dialog': 2.8.0
  '@tauri-apps/plugin-os': 2.4.0
  '@tauri-apps/plugin-global-shortcut': 2.4.0
  '@tauri-apps/plugin-opener': 2.6.0

  # Testing
  vitest: 5.0.2
  '@vitest/coverage-v8': 5.0.2
  '@testing-library/react': 16.3.3
  happy-dom: 20.14.5

  # Lint
  eslint: 10.11.0
  typescript-eslint: 8.71.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-config-prettier: 10.1.8
  globals: 17.12.0

allowBuilds:
  # esbuild (Astro/Vite in apps/site) fetches its native binary in a postinstall.
  esbuild: true
