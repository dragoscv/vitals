packages:
  - 'apps/*'
  - 'packages/*'

# pnpm quarantines packages published in the last 24 hours (1440 minutes), a
# real defence against a compromised maintainer: most malicious publishes are
# yanked within hours. "Latest stable" therefore means latest stable that is
# at least a day old (SEC-12; this was 0 until 2026-10-17). An urgent fix for
# a vulnerability goes in minimumReleaseAgeExclude, by name, with the
# advisory beside it, and comes out again once it is a day old.
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []

# Dependency install scripts run only when listed in allowBuilds below; any
# other package that wants one fails the install instead of being silently
# skipped or silently run.
strictDepBuilds: true

# Transitive fixes the direct dependants have not shipped yet. Each one
# failed `pnpm audit --audit-level high` in CI's Supply chain job on every
# run since 2026-10-05 (19 of 22). Remove a line once `pnpm why <name>`
# shows only patched versions without it.
#   source-map-js  GHSA-68fv-2mgg-jv7q (high)   via @vitest/coverage-v8 > magicast
#   postcss-selector-parser  (moderate)        via tailwind / postcss plugins
#   esbuild  dev-server file read on Windows (low)  via vitest > vite, tsup
overrides:
  source-map-js: '>=1.2.2'
  postcss-selector-parser: '>=7.1.6'
  esbuild: '>=0.28.1'

catalog:
  # React
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Build
  vite: 8.3.4
  '@vitejs/plugin-react': 6.1.2
  typescript: 7.0.2

  # Styling
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  lucide-react: 1.57.0
  radix-ui: 1.8.1
  motion: 14.2.0

  # State / data
  zustand: 5.0.15
  '@tanstack/react-virtual': 3.14.19

  # UI extras
  sonner: 2.0.8
  qrcode.react: 4.2.0

  # i18n
  i18next: 26.4.5
  react-i18next: 17.0.16

  # Tauri
  '@tauri-apps/api': 2.12.4
  '@tauri-apps/cli': 2.12.3
  '@tauri-apps/plugin-updater': 2.14.0
  '@tauri-apps/plugin-process': 2.4.0
  '@tauri-apps/plugin-autostart': 2.7.0
  '@tauri-apps/plugin-notification': 2.7.0
  '@tauri-apps/plugin-store': 2.5.0
  '@tauri-apps/plugin-dialog': 2.8.3
  '@tauri-apps/plugin-os': 2.4.0
  '@tauri-apps/plugin-global-shortcut': 2.4.1
  '@tauri-apps/plugin-opener': 2.7.2

  # Testing
  vitest: 5.0.4
  '@vitest/coverage-v8': 5.0.4
  '@testing-library/react': 16.3.3
  happy-dom: 21.0.1

  # Lint
  eslint: 10.12.0
  typescript-eslint: 8.71.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-config-prettier: 10.1.8
  globals: 17.13.0

allowBuilds:
  # esbuild (Astro/Vite in apps/site) fetches its native binary in a postinstall.
  esbuild: true
  # macOS only (an optional dependency of chokidar/vite). Ships a prebuilt
  # fsevents.node; its install script would only rebuild it with node-gyp.
  # Listed as false so strictDepBuilds does not fail the macOS release leg.
  fsevents: false
