# Latest stable of each, checked against Google Maven and Maven Central on
# 2026-09-28 (ADR-0033). Bump whole groups together; the Compose BOM decides
# every androidx.compose artefact.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
core = "1.19.1"
splashscreen = "1.2.0"
datastore = "1.2.1"
work = "2.12.0"
glance = "1.2.0"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
haze = "2.0.0"
camerax = "1.6.2"
mlkit-barcode = "17.3.0"
wear-compose = "1.7.0"
wear-tooling = "1.0.0"
wear-tiles = "1.6.2"
protolayout = "1.4.2"
complications = "1.3.0"
wear-ongoing = "1.1.0"
play-wearable = "20.0.1"
profileinstaller = "1.4.1"
baselineprofile = "1.5.0"
benchmark = "1.5.0"
uiautomator = "2.4.0"
junit = "4.13.2"

