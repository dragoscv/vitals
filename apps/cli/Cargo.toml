[package]
name = "vitals-cli"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Vitals command line companion."

[[bin]]
name = "vitals"
path = "src/main.rs"

[dependencies]
vitals-core = { workspace = true }
vitals-ipc = { workspace = true }
vitals-server = { workspace = true }
vitals-mcp = { workspace = true }

clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
ureq = { workspace = true }
comfy-table = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
vitals-win = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
vitals-macos = { workspace = true }

[dev-dependencies]
vitals-core = { workspace = true, features = ["fixtures"] }

[build-dependencies]
# The icon Windows draws in the firewall prompt, in Explorer and in Task Manager
# (see build.rs). Already in the tree through tauri-build, so no new download and
# no new licence: rustc writes no resource section of its own.
tauri-winres = "0.3.6"

[lints]
workspace = true
