[package]
name = "vitals-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Vitals — a modern, fast, native system monitor and task manager."

[lib]
# Required for the mobile/desktop shared entry point Tauri expects, and it
# lets the integration tests exercise the app setup without launching a window.
name = "vitals_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
vitals-core = { workspace = true }
vitals-store = { workspace = true }
vitals-server = { workspace = true }
vitals-bench = { workspace = true }

tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-store = "2.4.4"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-process = "2.3.1"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(windows)'.dependencies]
vitals-win = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
vitals-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
vitals-macos = { workspace = true }

[dependencies.tauri-plugin-updater]
version = "2.11.0"

[dependencies.tauri-plugin-single-instance]
version = "2.4.4"

[lints]
workspace = true
