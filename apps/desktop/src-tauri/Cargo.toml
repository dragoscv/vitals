[package]
name = "vitals-desktop"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Vitals — a modern, fast, native system monitor and task manager."

[lib]
# The shared entry point `main.rs` calls, and what the integration tests
# link against without launching a window.
#
# `rlib` only. Tauri's template adds `staticlib` and `cdylib` for its iOS and
# Android targets; this app has neither (the phone and watch apps are native
# Kotlin, `apps/android`). Those two crate types made every `cargo build` and
# `cargo test` link the whole app twice more: a 1.26 GB `.lib` and a DLL per
# profile, copied again into `deps/` — measured 2026-09-29 in a 29 GB
# `target/debug`. `scripts/check-target-size.ps1` guards the total.
name = "vitals_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
vitals-core = { workspace = true }
vitals-ipc = { workspace = true }
vitals-store = { workspace = true }
vitals-server = { workspace = true }
vitals-bench = { workspace = true }

tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.6.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-process = "2.4.0"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(windows)'.dependencies]
vitals-win = { workspace = true }
# Exit codes of the sensors helper; the client itself lives in vitals-win.
vitals-sensors = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
vitals-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
vitals-macos = { workspace = true }

[dependencies.tauri-plugin-updater]
version = "2.13.0"

[dependencies.tauri-plugin-single-instance]
version = "2.5.0"

[dev-dependencies]
# The tray tests need a plausible machine to format a tooltip from; the shared
# fixture is the only copy that stays in step when a metric field is added.
vitals-core = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
