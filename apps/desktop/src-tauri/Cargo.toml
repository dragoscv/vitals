[package]
name = "vitals-desktop"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Vitals — a modern, fast, native system monitor and task manager."

[lib]
# The shared entry point `main.rs` calls, and what the integration tests
# link against without launching a window.
#
# `rlib` only. Tauri's template adds `staticlib` and `cdylib` for its iOS and
# Android targets; this app has neither (the phone and watch apps are native
# Kotlin, `apps/android`). Those two crate types made every `cargo build` and
# `cargo test` link the whole app twice more: a 1.26 GB `.lib` and a DLL per
# profile, copied again into `deps/` — measured 2026-09-29 in a 29 GB
# `target/debug`. `scripts/check-target-size.ps1` guards the total.
name = "vitals_desktop_lib"
crate-type = ["rlib"]

[features]
default = ["self-update"]
# The GitHub-release updater. Every build has it except the Mac App Store one.
self-update = ["dep:tauri-plugin-updater"]
# The sandboxed Mac App Store build (ADR 0041): built with
# `--no-default-features --features app-store`, so the self-updater is not even
# linked, and the macOS sampler drops what the sandbox forbids.
app-store = ["vitals-macos/app-store"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
vitals-core = { workspace = true }
vitals-ipc = { workspace = true }
vitals-store = { workspace = true }
vitals-server = { workspace = true }
vitals-bench = { workspace = true }
vitals-agents = { workspace = true }
# Cloud agents on the AI page (ADR-0039). Already in the graph through
# tauri-plugin-updater with these exact features, so nothing new is built.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "system-proxy", "form"] }
# `rustls-no-provider` needs one installed; the updater installs `ring` the
# same way (updater.rs) — whichever request comes first does it.
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }

tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.6.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-process = "2.4.0"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(windows)'.dependencies]
vitals-win = { workspace = true }
# Exit codes of the sensors helper; the client itself lives in vitals-win.
vitals-sensors = { workspace = true }
# The renderer-exit handler (`crashlog::reload_on_renderer_exit`). Tauri
# hands out the raw WebView2 controller but not the event, so this is the
# binding Tauri itself uses — pinned to the version wry already locks, so it
# adds no crate to the build.
webview2-com = "0.39.1"

[target.'cfg(target_os = "linux")'.dependencies]
vitals-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
vitals-macos = { workspace = true }
# The Health page's vmui token in the Keychain (health.rs). Already in the
# lock through the TLS stack; no default features, so nothing new is built.
security-framework = { version = "3.7.0", default-features = false }

[dependencies.tauri-plugin-updater]
version = "2.13.0"
# Optional: the Mac App Store build leaves the self-updater out entirely
# (guideline 2.4.5(vii)); the store updates it. See [features] below.
optional = true
# Without the default `zip` feature. It only unpacks `.zip` (Windows) and
# gzipped AppImage update archives, and Vitals publishes neither: the Windows
# update is the raw `-setup.exe`, Linux the raw `.AppImage`, and the macOS
# `.app.tar.gz` path uses tar/flate2, which are not optional there. The
# feature pulled zip 4.x, whose extract() follows symlinks out of the target
# (RUSTSEC-2026-0367/0368/0369, fixed only in zip 9, which no updater
# release accepts yet). Restore it only together with a zip >= 9.
default-features = false
features = ["rustls-tls", "system-proxy"]

[dependencies.tauri-plugin-single-instance]
version = "2.5.0"

[dev-dependencies]
# The tray tests need a plausible machine to format a tooltip from; the shared
# fixture is the only copy that stays in step when a metric field is added.
vitals-core = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
