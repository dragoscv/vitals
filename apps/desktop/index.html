<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitals</title>
  <!--
      The splash is inlined in the document rather than rendered by React so
      it is visible on the very first paint, before any JavaScript has parsed.
      A window that shows an empty rectangle for 200ms reads as a slow app,
      and first-launch perception is most of how "fast" is judged.
    -->
  <style>
    :root {
      color-scheme: light dark;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #f8f8f9;
    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background: #1c1c1f;
      }
    }

    #splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      transition: opacity 180ms ease-out;
    }

    #splash[hidden] {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="splash" aria-hidden="true">
    <!-- brand:splash (generated by brand/scripts/build.mjs) -->
      <style>
        .splash-mark { width: 64px; height: 64px; overflow: visible; }
        .splash-mark .t { transform-box: fill-box; transform-origin: center; animation: sm-tile 495ms cubic-bezier(0.22, 1, 0.36, 1) both; }
        .splash-mark .l { stroke-dasharray: 1; animation: sm-draw 630ms cubic-bezier(0.22, 1, 0.36, 1) 270ms both; }
        .splash-mark .r { stroke-dasharray: 0.28 1.28; opacity: 0; animation: sm-trace 1600ms cubic-bezier(0.45, 0, 0.55, 1) 900ms infinite; }
        @keyframes sm-tile { from { opacity: 0; transform: scale(0.9); } }
        @keyframes sm-draw { from { stroke-dashoffset: 1; } }
        @keyframes sm-trace { from { opacity: 1; stroke-dashoffset: 0.28; } to { opacity: 1; stroke-dashoffset: -1; } }
        @media (prefers-reduced-motion: reduce) { .splash-mark * { animation: none !important; } }
      </style>
      <svg class="splash-mark" id="splash-mark" viewBox="0 0 48 48">
        <defs><linearGradient id="sg" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#227c45"/><stop offset="1" stop-color="#135c30"/></linearGradient></defs>
        <rect class="t" x="3" y="3" width="42" height="42" rx="10" fill="url(#sg)"/>
        <path class="l" d="M10 25.5H17L24 33.5L38 14" pathLength="1" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="r" d="M10 25.5H17L24 33.5L38 14" pathLength="1" fill="none" stroke="#b2f48c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <!-- /brand:splash -->
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
