# XcodeGen spec (ADR-0041). The .xcodeproj is generated by scripts/build.sh and
# never committed. Signing team comes from $DEVELOPMENT_TEAM (no secrets here).
name: Vitals
options:
  bundleIdPrefix: app.vitals
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: '1.2.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  VitalsCore:
    path: VitalsCore
targets:
  Vitals:
    type: application
    platform: iOS
    # Explicit shared schemes for both apps: once one target has a scheme,
    # Xcode stops auto-creating them for the others.
    scheme: {}
    sources:
      - path: Vitals
    dependencies:
      - package: VitalsCore
      # A watchOS application as a dependency of an iOS application lands in
      # the "Embed Watch Content" phase ($(CONTENTS_FOLDER_PATH)/Watch), so the
      # Vitals scheme builds, signs and archives the watch app with the phone's.
      - target: VitalsWatch
        embed: true
    info:
      path: Vitals/Info.plist
      properties:
        # Discovery of PCs advertising the LAN server (TN3179): listing the
        # exact type means no multicast entitlement is needed to browse.
        NSBonjourServices: ['_vitals._tcp']
        # The LAN API is plain HTTP by design; ATS allows it for local
        # addresses only. Public addresses are refused in VitalsCore.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.vitals.ios.scan
            UIApplicationShortcutItemTitle: Scan code
            UIApplicationShortcutItemIconSymbolName: qrcode.viewfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vitals.ios
        # The bundle name (CFBundleName = PRODUCT_NAME) must be unique on the
        # App Store too; INFOPLIST_KEY_CFBundleName does not override it.
        PRODUCT_NAME: VitalsMonitor
        PRODUCT_MODULE_NAME: Vitals
        # iPhone only until iPad screenshots and an iPad test exist.
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # "Vitals" alone is taken on the App Store (ITMS-90129, build 251, 2026-10-28):
        # both the bundle name and the display name must be unique.
        INFOPLIST_KEY_CFBundleDisplayName: Vitals Monitor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Plain HTTP on the LAN and the OS's TLS only: exempt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Usage descriptions: English here, Romanian in Vitals/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Vitals connects to the PCs you pair on your home network to show their readings.
        INFOPLIST_KEY_NSCameraUsageDescription: Vitals uses the camera only to scan the pairing code shown on your PC.

  # The Apple Watch companion: shows the PCs the iPhone already watches, sent
  # over WatchConnectivity. No pairing, no network access of its own.
  VitalsWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    scheme: {}
    sources:
      - path: VitalsWatch
      # One catalog for both apps: generated by scripts/ios-strings.mjs.
      - path: Vitals/Localizable.xcstrings
    dependencies:
      - package: VitalsCore
    info:
      # Written by XcodeGen on every generate, like Vitals/Info.plist. A
      # single-target SwiftUI watch app is marked by WKApplication.
      path: VitalsWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.vitals.ios
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vitals.ios.watchkitapp
        PRODUCT_NAME: VitalsMonitorWatch
        PRODUCT_MODULE_NAME: VitalsWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vitals Monitor
        # WKRunsIndependentlyOfCompanionApp false (Info.plist above): it needs
        # the phone for every reading, so it is not a standalone app.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        # Archived inside the iPhone app only, never as a second top-level
        # product (which would make a "generic" archive App Store Connect refuses).
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # The catalog is generated, not extracted from this target's code.
        SWIFT_EMIT_LOC_STRINGS: NO
