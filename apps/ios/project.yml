# XcodeGen spec (ADR-0041). The .xcodeproj is generated by scripts/build.sh and
# never committed. Signing team comes from $DEVELOPMENT_TEAM (no secrets here).
name: Vitals
options:
  bundleIdPrefix: app.vitals
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: '1.1.1'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  VitalsCore:
    path: VitalsCore
targets:
  Vitals:
    type: application
    platform: iOS
    sources:
      - path: Vitals
    dependencies:
      - package: VitalsCore
    info:
      path: Vitals/Info.plist
      properties:
        # Discovery of PCs advertising the LAN server (TN3179): listing the
        # exact type means no multicast entitlement is needed to browse.
        NSBonjourServices: ['_vitals._tcp']
        # The LAN API is plain HTTP by design; ATS allows it for local
        # addresses only. Public addresses are refused in VitalsCore.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.vitals.ios.scan
            UIApplicationShortcutItemTitle: Scan code
            UIApplicationShortcutItemIconSymbolName: qrcode.viewfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vitals.ios
        PRODUCT_NAME: Vitals
        # iPhone only until iPad screenshots and an iPad test exist.
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # "Vitals" alone is taken on the App Store (ITMS-90129, build 251, 2026-10-28):
        # both the bundle name and the display name must be unique.
        INFOPLIST_KEY_CFBundleDisplayName: Vitals Monitor
        INFOPLIST_KEY_CFBundleName: Vitals Monitor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Plain HTTP on the LAN and the OS's TLS only: exempt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Usage descriptions: English here, Romanian in Vitals/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Vitals connects to the PCs you pair on your home network to show their readings.
        INFOPLIST_KEY_NSCameraUsageDescription: Vitals uses the camera only to scan the pairing code shown on your PC.
