[workspace]
resolver = "3"
members = [
    "crates/vitals-core",
    "crates/vitals-ipc",
    "crates/vitals-store",
    "crates/vitals-bench",
    "crates/vitals-win",
    "crates/vitals-linux",
    "crates/vitals-macos",
    "apps/desktop/src-tauri",
    "apps/helper",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/dragoscv/vitals"
authors = ["Vitals contributors"]

[workspace.dependencies]
# Internal
vitals-core = { path = "crates/vitals-core" }
vitals-ipc = { path = "crates/vitals-ipc" }
vitals-store = { path = "crates/vitals-store" }
vitals-bench = { path = "crates/vitals-bench" }
vitals-win = { path = "crates/vitals-win" }
vitals-linux = { path = "crates/vitals-linux" }
vitals-macos = { path = "crates/vitals-macos" }

# Only crates an existing member actually depends on belong here. A dependency
# declared for a subsystem that does not exist yet misrepresents the
# architecture — `rusqlite = { features = ["bundled"] }` sat here for months
# implying a time-series store that had never been written. Add the entry in
# the same commit as the code that uses it.
#
# Core
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Async / concurrency
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
parking_lot = "0.12.5"

# Data
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Local HTTP API (vitals-server)
#
# axum rather than actix-web because Tauri already runs a multi-thread tokio
# runtime: axum adds no second executor, actix brings its own `System` that
# would have to be babysat from a non-main thread. tiny_http is disqualified
# outright — it has no WebSocket upgrade support.
#
# Default features are off: `tracing`, `form`, `matched-path` and
# `original-uri` are dead weight for a handful of JSON routes on a LAN.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
tower-http = { version = "0.7.1", default-features = false, features = ["set-header"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
subtle = "2.6.1"
local-ip-address = "0.6.13"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

# Type generation
#
# ts-rs rather than specta: specta's TypeScript exporter
# (`specta-typescript`) only supports `specta 2.0.0-rc.x`, and its last
# stable line (1.0.5) has no exporter at all. Shipping the type-generation
# step of the build on a release candidate is not a trade worth making.
# ts-rs 12 is stable, handles every shape in the domain model, and emits
# cleaner output.
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }

# Platform

# IPC
interprocess = { version = "2.4.4", features = ["tokio"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noisy pedantic lints we deliberately opt out of.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Hard bans for sampling hot paths.
unwrap_used = "warn"
# `.expect()` panics identically to `.unwrap()`, and with `panic = "abort"` in
# release one of them in the sampler thread takes the whole process down. It
# was allowed here directly under a comment banning exactly this.
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Dependencies are optimised even in dev — sampling code is unusably slow otherwise.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.bench-perf]
inherits = "release"
debug = true
strip = false
