name: Feature request
description: Something Vitals should be able to do.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        The best feature requests come from a real frustration. Tell us what
        you were trying to do and what got in the way — that is worth far more
        than a description of the solution.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The underlying goal, not the feature you have in mind.
      placeholder: |
        I want to know which program is saturating my upload while I am in a
        call, but Task Manager only shows a total.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would solve it?
      description: Your idea, if you have one. Leave blank if you would rather we work it out.

  - type: textarea
    id: prior_art
    attributes:
      label: Does another tool already do this well?
      description: |
        Naming a tool that gets it right is genuinely useful — it tells us what
        good looks like and saves a round of design.
      placeholder: e.g. GlassWire's per-app graph, but I want it built in.

  - type: dropdown
    id: area
    attributes:
      label: Which area
      options:
        - Dashboard / widgets
        - Performance
        - Processes
        - Startup / services
        - Network
        - Storage
        - Devices & sensors
        - Benchmarks
        - Settings / theming
        - Something else
    validations:
      required: true
