# Latest-stable policy (ADR 0005): every dependency is expected to move
# forward continuously. Monthly and grouped: each pull request runs the full
# CI (four Windows jobs), and four ecosystems weekly meant sixteen runs a
# month that mostly bumped patch versions. Security fixes do not wait for
# this schedule — Dependabot security updates open their own PRs at once.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # v3 breaks release creation with a 403 (upstream issue #836); stay on
    # v2.6.2 until that is fixed, then delete this block.
    ignore:
      - dependency-name: softprops/action-gh-release
        versions: ['>=3']
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ['*']
    open-pull-requests-limit: 5
