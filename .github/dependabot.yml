# Latest-stable policy (ADR 0005): every dependency is expected to move
# forward continuously. Weekly, grouped, so a Monday brings three PRs rather
# than thirty.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ['*']
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # v3 breaks release creation with a 403 (upstream issue #836); stay on
    # v2.6.2 until that is fixed, then delete this block.
    ignore:
      - dependency-name: softprops/action-gh-release
        versions: ['>=3']
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle:
        patterns: ['*']
    open-pull-requests-limit: 5
