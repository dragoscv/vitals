name: Release

# Tagged releases. A manual run builds everything and publishes nothing.
#
# Scheduled nightlies were dropped on 2026-10-18 (PM2-7): the last one ran on
# 2026-09-29, every later scheduled run skipped all its jobs, nobody installs
# them, and a moving "nightly" pre-release beside real releases confused the
# download page. CI builds and round-trips an installer on every push to
# main (ci.yml), which is what a nightly used to prove.
#
# Shape: plan -> verify (tags only) -> build matrix + SBOM -> publish ->
# distribution channels (tags only, each opt-in). Everything that must see
# every platform's output at once — latest.json, SHA256SUMS.txt, the stable
# download names, the updater signatures — happens in `publish`, never in a
# build leg: two legs racing to upload the same filename publish whichever
# finished last and silently drop the other.
#
# The updater key is read in exactly one place: the signing step of
# `publish`, which on a tag runs only after the owner approves the `release`
# environment. Build legs compile repository code (and its dependencies'
# build scripts) before anyone has looked at the run, so they never see it.
#
# The owner-facing guide to secrets, variables and channels is
# docs/releasing.md. Keep the two in step.

on:
  push:
    tags:
      - 'v*'
  # Build every platform from any ref without publishing anything: to try a
  # workflow change, or to get an installer from a branch.
  workflow_dispatch:

permissions:
  contents: read

# Each tag has its own group and is never cancelled half-published. Manual
# build-only runs share one group per ref, and a newer one cancels the older:
# they publish nothing, so nothing is lost. (Before 2026-10-17 every run on
# main shared one group, and a nightly waiting on approval held it for days,
# QA-4.)
concurrency:
  group: ${{ format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS here. `-D warnings` changes the compilation
  # fingerprint, so every artefact rust-cache restored from ci.yml would be
  # rebuilt cold. Clippy below passes `-D warnings` explicitly, which is
  # where the guarantee belongs.

jobs:
  # One place decides what this run is, so no two jobs can disagree about
  # the version, the tag or whether anything gets published.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      is_release: ${{ steps.plan.outputs.is_release }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      title: ${{ steps.plan.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: plan
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $isRelease = $env:REF -like 'refs/tags/v*'
          $shouldBuild = $true
          # Only a tag publishes. A manual run is a build check.
          $publish = $isRelease

          if ($isRelease) {
            $version = $env:REF_NAME -replace '^v', ''
            $tag = $env:REF_NAME
            # See the comment on "Publish release" for why a beta is not
            # marked as a GitHub pre-release; the title carries it instead.
            $title = if ($version -notmatch '-') { "Vitals $version" }
              elseif ($version -match 'beta') { "Vitals $version (public beta)" }
              else { "Vitals $version (pre-release)" }
          } else {
            # A build-only run is dated and carries the short SHA, so an
            # installer taken from it names exactly one build. The `g` keeps
            # the identifier alphanumeric: an all-digit SHA with a leading
            # zero is not valid SemVer, and Tauri refuses to bundle it.
            $current = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            $base = ($current -split '-')[0]
            $sha = (git rev-parse --short=7 HEAD).Trim()
            $version = "$base-build.$((Get-Date).ToUniversalTime().ToString('yyyyMMdd')).g$sha"
            $tag = ''
            $title = "Build $version"
          }

          $lines = @(
            "should_build=$($shouldBuild.ToString().ToLower())"
            "is_release=$($isRelease.ToString().ToLower())"
            "publish=$($publish.ToString().ToLower())"
            "version=$version"
            "tag=$tag"
            "title=$title"
          )
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

  # A release must never ship code its own gates have not passed. ci.yml
  # already ran on the commit, but a tag can point anywhere, including a
  # commit CI never saw, so a tag re-proves it. A build-only run skips this:
  # it publishes nothing.
  verify:
    name: Verify
    needs: plan
    if: needs.plan.outputs.is_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    # Identical to ci.yml's top-level env. rust-cache hashes every CARGO_* and
    # RUST* variable into its key, so any difference here and the tag would
    # miss the warm `windows-test` cache main keeps and compile cold.
    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Before any compile: an updater release without its minisign key
      # produces installers every existing copy of Vitals refuses. Fail in
      # seconds rather than after twenty minutes of building. The comparison
      # runs on GitHub's side, so only `true`/`false` reaches this runner,
      # never the key: this job runs before the owner's approval (SEC-5).
      - name: Updater signing key present
        shell: pwsh
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:HAS_UPDATER_KEY -ne 'true') {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not set. A tagged release without it ships updates no installed copy will accept. See docs/releasing.md.'
          }
          Write-Host 'updater signing key is configured'

      # The updater compares the installed version with latest.json; a tag
      # whose manifests say something else either offers itself forever or
      # never.
      - name: Version matches the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: pwsh -NoProfile -File scripts/version.ps1 -Check $env:TAG

      # The same rule the `play` job enforces (AND-34), checked here as well
      # because `play` runs after the GitHub release is public: a stale or
      # oversized "what's new" should stop the tag before anything ships.
      - name: Play release notes name this version
        if: vars.PUBLISH_PLAY == 'true'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $bad = 0
          foreach ($f in Get-ChildItem apps/android/play/listing -Recurse -Filter default.txt -File | Where-Object { $_.Directory.Name -eq 'changelogs' }) {
            $text = [IO.File]::ReadAllText($f.FullName)
            $chars = [Globalization.StringInfo]::new($text).LengthInTextElements
            if ($chars -gt 500) { Write-Host "::error file=$($f.FullName)::$chars characters; Google Play allows 500"; $bad++ }
            if (-not $text.Contains($version)) { Write-Host "::error file=$($f.FullName)::does not mention $version"; $bad++ }
          }
          if ($bad) { throw "$bad Play release-notes problem(s)" }

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # rust-toolchain.toml
        with:
          toolchain: 1.99.0

      # Restore-only: main's CI owns this entry; a tag must not overwrite it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-test
          save-if: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Two seconds, and catches what a compile cannot: serde casing against
      # the generated TypeScript, invoke() with no command, locale parity.
      # GitHub's runners do not ship ripgrep; the drift script needs it.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: ripgrep

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-deny

      # One gate list, shared with local runs and the pre-push hook. This job
      # used to repeat CI's steps by hand and had quietly lost the notices,
      # licence and bundle-size checks; now a gate added to verify.ps1 guards
      # a tag too. Perf runs as its own step below so its output is readable.
      - name: Every gate (scripts/verify.ps1)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1 -SkipPerf -Force
      # Release build: debug would measure the compiler's lack of
      # optimisation rather than our code.
      - name: Performance budget
        run: cargo test -p vitals-win --release --test overhead -- --nocapture

  build:
    name: Build (${{ matrix.platform.name }})
    needs: [plan, verify]
    # `verify` is skipped for build-only runs, and a skipped dependency would
    # otherwise skip this job too. `!cancelled()` rather than `always()` so a
    # cancelled run stays cancelled.
    if: >-
      !cancelled() &&
      needs.plan.outputs.should_build == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            arch: x64
          - name: windows-arm64
            os: windows
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis
            arch: arm64
          # macOS (real sampler since S23, ADR 0041) and Linux are built on
          # every run so the ports never rot. Published only when the matching
          # repo variable says so. macOS builds the bare .app here, unsigned:
          # Developer ID signing, notarisation and the DMG happen in
          # `macos-sign`, after the owner's approval, because this job runs
          # every dependency's build script and must hold no Apple secret.
          - name: macos-universal
            os: macos
            runner: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app
          # 22.04 rather than latest: an AppImage links against the build
          # machine's glibc, so the oldest supported base runs on the most
          # distributions.
          - name: linux-x64
            os: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm

    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    # An unpublished platform must not hold back a Windows release: a leg
    # that fails there shows red, but the run carries on. Once a platform is
    # published it becomes a hard gate, because latest.json would otherwise
    # name a file that does not exist.
    continue-on-error: ${{ (matrix.platform.os == 'macos' && vars.PUBLISH_MACOS != 'true') || (matrix.platform.os == 'linux' && vars.PUBLISH_LINUX != 'true') }}

    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IS_RELEASE: ${{ needs.plan.outputs.is_release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # rust-toolchain.toml
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.platform.rust_targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.platform.target }}
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tag's manifests already match (verify proved it). A build-only
      # run's do not, and without this its installer would claim to be the
      # last release, indistinguishable in a bug report.
      - name: Stamp build version
        if: needs.plan.outputs.is_release != 'true'
        shell: pwsh
        # The stamp changes every workspace crate's version, so Cargo.lock is
        # stale and bundle-sensors' `cargo build --locked` refused it: both
        # Windows legs of every such run since the helper landed (2026-09-29).
        # --workspace rewrites only our own crates' entries; no dependency
        # moves, which is what --locked is there to guarantee. Not --offline:
        # a fresh runner has no registry index yet ("no matching package
        # named `serde`", run 36571857361).
        run: |
          pwsh -NoProfile -File scripts/version.ps1 -Set $env:VERSION
          cargo update --workspace

      # Everything that varies per run goes into one JSON merge-patch passed
      # with --config, written outside the tree so it can never be committed.
      - name: Build configuration
        id: config
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          PLATFORM_OS: ${{ matrix.platform.os }}
        run: |
          $override = @{}
          $bundle = @{}

          # Never sign updates here (SEC-5). This job runs repository code
          # and every dependency's build script before the owner has
          # approved anything, so it must not hold the minisign key. Tauri
          # refuses createUpdaterArtifacts without the private key, so it is
          # off on every leg; `publish` signs the installers after approval
          # with `tauri signer sign`, which is what `tauri build` would have
          # done (on Windows and Linux the updater consumes the installer
          # itself; on macOS the collect step packs the .app.tar.gz).
          $bundle['createUpdaterArtifacts'] = $false

          # Authenticode is optional until a certificate is funded
          # (docs/distribution.md). With it, Tauri calls signtool on every
          # binary and on the installer; without it the build is unsigned and
          # SmartScreen warns, which the release notes explain.
          if ($env:PLATFORM_OS -eq 'windows') {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              Write-Host '::notice::No WINDOWS_CERTIFICATE: the installer is not Authenticode-signed.'
            } else {
              $pfx = Join-Path $env:RUNNER_TEMP 'vitals-signing.pfx'
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
              Remove-Item $pfx -Force
              $bundle['windows'] = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm       = 'sha256'
                timestampUrl          = 'http://timestamp.digicert.com'
              }
              Write-Host "Authenticode signing with certificate $($cert.Thumbprint.Substring(0, 8))..."
            }
          }

          $path = ''
          if ($bundle.Count -gt 0) {
            $override['bundle'] = $bundle
            $path = Join-Path $env:RUNNER_TEMP 'tauri.override.json'
            $override | ConvertTo-Json -Depth 5 | Set-Content -Path $path -Encoding utf8NoBOM
          }
          "path=$path" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      # --target always, even for the host triple, so the bundle lands in
      # target/<triple>/release/bundle on every leg and the collect step has
      # exactly one path to look in. --bundles because tauri.conf.json lists
      # only nsis, which produces nothing on macOS or Linux.
      - name: Build
        shell: pwsh
        env:
          TARGET: ${{ matrix.platform.target }}
          BUNDLES: ${{ matrix.platform.bundles }}
          OVERRIDE: ${{ steps.config.outputs.path }}
        run: |
          $tauriArgs = @('build', '--target', $env:TARGET, '--bundles', $env:BUNDLES)
          if ($env:OVERRIDE) { $tauriArgs += @('--config', $env:OVERRIDE) }
          pnpm --filter @vitals/desktop tauri @tauriArgs
          if ($LASTEXITCODE -ne 0) { throw "tauri build exited $LASTEXITCODE" }

      # The `vitals` command-line tool (apps/cli), shipped beside the
      # installer as a zip (DOC-2) and not inside it yet. After the app so
      # it reuses the dependencies that build just compiled for this target.
      # --locked: the stamp step already refreshed our own crates' entries.
      - name: Build CLI
        if: matrix.platform.os == 'windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM: ${{ matrix.platform.name }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          cargo build --release --locked -p vitals-cli --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "cargo build -p vitals-cli exited $LASTEXITCODE" }
          $exe = "target/$env:TARGET/release/vitals.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "vitals --version exited $LASTEXITCODE" }
          $out = "dist/$env:PLATFORM"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'vitals-cli'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe, LICENSE, THIRD_PARTY_NOTICES.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$out/vitals-cli_$($env:VERSION)_$($env:ARCH).zip" -Force

      - name: Collect artefacts
        shell: pwsh
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM: ${{ matrix.platform.name }}
          PLATFORM_OS: ${{ matrix.platform.os }}
          # macOS tar would otherwise add ._* AppleDouble entries to the
          # updater archive, which then land inside the installed .app.
          COPYFILE_DISABLE: '1'
        run: |
          $out = "dist/$env:PLATFORM"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bundles = "target/$env:TARGET/release/bundle"

          # The file each platform's updater consumes, plus whatever a person
          # downloads by hand.
          $updater = @()
          switch ($env:PLATFORM_OS) {
            'windows' {
              $updater = @(Get-ChildItem "$bundles/nsis" -Filter '*-setup.exe' -File)
              $updater | Copy-Item -Destination $out
            }
            'macos' {
              # The unsigned .app, zipped with ditto so symlinks and extended
              # attributes survive the artefact round trip. `macos-sign`
              # turns it into the notarised DMG and the updater tarball;
              # nothing from this leg is published as is.
              $app = Get-ChildItem "$bundles/macos" -Filter '*.app' -Directory | Select-Object -First 1
              if ($null -ne $app) {
                $dest = Join-Path (Resolve-Path $out) "Vitals_$($env:VERSION)_universal.app.zip"
                ditto -c -k --keepParent $app.FullName $dest
                if ($LASTEXITCODE -ne 0) { throw "ditto exited $LASTEXITCODE" }
                $updater += Get-Item $dest
              }
            }
            'linux' {
              $updater = @(Get-ChildItem "$bundles/appimage" -Filter '*.AppImage' -File)
              $updater | Copy-Item -Destination $out
              Get-ChildItem "$bundles/deb" -Filter '*.deb' -File | Copy-Item -Destination $out
              Get-ChildItem "$bundles/rpm" -Filter '*.rpm' -File | Copy-Item -Destination $out
            }
          }

          if ($updater.Count -eq 0) {
            throw "nothing under $bundles; the bundle step silently failed"
          }
          # Signatures are added in `publish`; a .sig here means a key leaked
          # into this job.
          if (Get-ChildItem $out -Filter '*.sig' -File) { throw 'a build leg produced a .sig; the updater key must not reach this job' }

          Get-ChildItem $out -File | ForEach-Object { "  $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitals-${{ matrix.platform.name }}
          path: dist/${{ matrix.platform.name }}/*
          if-no-files-found: error
          retention-days: 30

  # What is inside the installer, in a machine-readable form a security team
  # can feed to a scanner. Windows host so cargo resolves the Windows-only
  # dependency tree (vitals-win and its crates) — the one that ships.
  sbom:
    name: SBOM
    needs: [plan, verify]
    if: >-
      !cancelled() &&
      needs.plan.outputs.should_build == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # rust-toolchain.toml
        with:
          toolchain: 1.99.0

      # Prebuilt binary; compiling it from source costs minutes per run.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-cyclonedx

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rust SBOM
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          cargo cyclonedx --format json --override-filename sbom-rust
          if ($LASTEXITCODE -ne 0) { throw "cargo cyclonedx exited $LASTEXITCODE" }
          $file = Get-ChildItem -Filter 'sbom-rust*.json' -File | Select-Object -First 1
          if ($null -eq $file) { throw 'cargo cyclonedx wrote no sbom-rust*.json beside the desktop crate' }
          New-Item -ItemType Directory -Force -Path ../../../sbom | Out-Null
          Copy-Item $file.FullName ../../../sbom/sbom-rust.cdx.json

      # The CLI zip is a separate binary with its own dependency tree
      # (clap, crossterm, no webview), so it gets its own SBOM.
      - name: CLI SBOM
        shell: pwsh
        working-directory: apps/cli
        run: |
          cargo cyclonedx --format json --override-filename sbom-cli
          if ($LASTEXITCODE -ne 0) { throw "cargo cyclonedx exited $LASTEXITCODE" }
          $file = Get-ChildItem -Filter 'sbom-cli*.json' -File | Select-Object -First 1
          if ($null -eq $file) { throw 'cargo cyclonedx wrote no sbom-cli*.json beside the CLI crate' }
          Copy-Item $file.FullName ../../sbom/sbom-cli.cdx.json

      # Scoped to the desktop app and production dependencies: the root
      # workspace would list every linter and test runner, none of which
      # ships.
      - name: JavaScript SBOM
        shell: pwsh
        run: |
          pnpm --filter @vitals/desktop sbom --sbom-format cyclonedx --sbom-type application --prod --lockfile-only |
            Set-Content -Path sbom/sbom-js.cdx.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "pnpm sbom exited $LASTEXITCODE" }
          $count = (Get-Content sbom/sbom-js.cdx.json -Raw | ConvertFrom-Json).components.Count
          Write-Host "JavaScript SBOM: $count components"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitals-sbom
          path: sbom/*
          if-no-files-found: error

  # Phone, watch and TV apps (ADR-0033), built UNSIGNED. This job runs
  # repository code and every Gradle plugin before anyone has approved the
  # run, so it never sees the upload key (SEC2-4: it used to decode
  # ANDROID_KEYSTORE_B64 here, on every run, nightlies included). `publish`
  # signs the APKs (apksigner) and bundles (jarsigner) after the owner has
  # approved the `release` environment, the same rule as the updater key.
  android:
    name: Build (android)
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: microsoft
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Contract and unit tests
        run: ./gradlew :core:testDebugUnitTest :device:testDebugUnitTest :shared-ui:testDebugUnitTest :wear:verifyRoborazziDebug :tv:lintPlayDebug --console=plain

      # No ANDROID_KEYSTORE_PATH, so the build files leave the release
      # variants unsigned (apps/android/*/build.gradle.kts).
      - name: Build unsigned APKs and bundles
        env:
          VITALS_VERSION: ${{ needs.plan.outputs.version }}
          # Monotonic across runs; Play and Obtainium both
          # refuse an update whose versionCode is not higher.
          VITALS_VERSION_CODE: ${{ github.run_number }}
        # Two flavours of :app and :tv (ADR-0033 addendum, 2026-10-14): the
        # APKs on GitHub are `github` (folder scan, all-files access); the
        # bundles for Google Play are `play` (no all-files access, which Play
        # rejected for a system monitor). The watch has no flavours.
        run: ./gradlew :app:assembleGithubRelease :wear:assembleRelease :tv:assembleGithubRelease :app:bundlePlayRelease :wear:bundleRelease :tv:bundlePlayRelease --console=plain

      - name: Collect
        env:
          VITALS_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/android-unsigned"
          mkdir -p "$out/apk" "$out/play"
          # Exactly one APK per variant (AGP names it *-unsigned.apk when
          # there is no signing config); a second match means a stale build.
          one() { local m=("$1"/*."$2"); [ "${#m[@]}" -eq 1 ] && [ -f "${m[0]}" ] || { echo "::error::expected one *.$2 in $1, found ${#m[@]}"; exit 1; }; cp "${m[0]}" "$3"; }
          one app/build/outputs/apk/github/release apk "$out/apk/Vitals_${VITALS_VERSION}_android.apk"
          one wear/build/outputs/apk/release apk "$out/apk/Vitals_${VITALS_VERSION}_wear.apk"
          one tv/build/outputs/apk/github/release apk "$out/apk/Vitals_${VITALS_VERSION}_tv.apk"
          one app/build/outputs/bundle/playRelease aab "$out/play/vitals-android.aab"
          one wear/build/outputs/bundle/release aab "$out/play/vitals-wear.aab"
          one tv/build/outputs/bundle/playRelease aab "$out/play/vitals-tv.aab"
          # The policy line, enforced where it matters: a Play bundle that asks
          # for all-files access is rejected in review days later; fail now.
          for aab in "$out/play/vitals-android.aab" "$out/play/vitals-tv.aab"; do
            if unzip -p "$aab" base/manifest/AndroidManifest.xml | grep -a -q MANAGE_EXTERNAL_STORAGE; then
              echo "::error::$aab declares MANAGE_EXTERNAL_STORAGE; Google Play rejects it (2026-10-14)"; exit 1
            fi
          done
          # Unsigned means unsigned: a signature here means a key reached
          # this job.
          for apk in "$out"/apk/*.apk; do
            if unzip -l "$apk" | grep -E -q 'META-INF/.*\.(RSA|EC|DSA)$'; then echo "::error::$apk carries a v1 signature; the upload key must not reach this job"; exit 1; fi
          done
          ls -l "$out"/apk "$out"/play

      # Attested in `publish`, after signing: the signed bytes are what ships.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-unsigned
          path: android-unsigned/
          if-no-files-found: error
          retention-days: 30

  # Developer ID signing + notarisation of the macOS app (ADR 0041). A tag
  # job in the `release` environment, so the Apple certificate and the App
  # Store Connect key exist only after the owner approves — the same rule the
  # updater and Android keys follow (SEC-5, SEC2-4). Skips with a notice when
  # PUBLISH_MACOS is off; scripts/macos/sign-notarise.sh is the whole job and
  # runs identically by hand on vmui-mac.
  macos-sign:
    name: Sign + notarise macOS
    needs: [plan, build]
    if: >-
      !cancelled() &&
      needs.plan.outputs.publish == 'true' &&
      needs.build.result == 'success' &&
      vars.PUBLISH_MACOS == 'true'
    runs-on: macos-latest
    # Apple's first notarisation for a team took 32 min (2026-10-28); two
    # submissions (app, then DMG) need headroom beyond the usual few minutes.
    timeout-minutes: 150
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vitals-macos-universal
          path: unsigned

      - name: Sign, notarise, staple, DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not set in the release environment"; exit 1; fi
          done
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          mkdir -p app
          ditto -x -k "unsigned/Vitals_${VERSION}_universal.app.zip" app
          bash scripts/macos/sign-notarise.sh app/Vitals.app "$VERSION" signed
          rm -f signed/notary.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitals-macos-signed
          path: signed/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: [plan, build, sbom, android, macos-sign]
    # `build` reports success even when an unpublished platform's leg failed
    # (continue-on-error), so this gate is exactly "everything we publish
    # built". The assemble step then refuses a missing published artefact.
    if: >-
      !cancelled() &&
      needs.plan.outputs.publish == 'true' &&
      needs.build.result == 'success' &&
      needs.sbom.result == 'success' &&
      needs.android.result == 'success' &&
      (needs.macos-sign.result == 'success' || (needs.macos-sign.result == 'skipped' && vars.PUBLISH_MACOS != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The owner approves every tag in the `release` environment; nothing
    # reaches installed copies' updater without it, and the updater key and
    # the Android upload key are only read after that approval. Only tags
    # get here (plan: publish == is_release).
    environment: release
    permissions:
      contents: write
      # Build-provenance and SBOM attestations.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      IS_RELEASE: ${{ needs.plan.outputs.is_release }}
      REPOSITORY: ${{ github.repository }}
      PUBLISH_MACOS: ${{ vars.PUBLISH_MACOS }}
      PUBLISH_LINUX: ${{ vars.PUBLISH_LINUX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artefacts
          pattern: vitals-*

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-unsigned
          path: android-unsigned

      - name: Assemble published files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          $legs = @('vitals-windows-x64', 'vitals-windows-arm64', 'vitals-sbom')
          # The signed, notarised macOS files; the unsigned .app.zip is never published.
          if ($env:PUBLISH_MACOS -eq 'true') { $legs += 'vitals-macos-signed' }
          if ($env:PUBLISH_LINUX -eq 'true') { $legs += 'vitals-linux-x64' }
          foreach ($leg in $legs) {
            if (-not (Test-Path "artefacts/$leg")) { throw "artefact $leg is missing; refusing to publish a partial release" }
            Copy-Item "artefacts/$leg/*" -Destination publish
          }
          foreach ($arch in 'x64', 'arm64') {
            if (-not (Test-Path "publish/vitals-cli_$($env:VERSION)_$arch.zip")) { throw "vitals-cli_$($env:VERSION)_$arch.zip is missing; refusing to publish a partial release" }
          }
          foreach ($held in @('vitals-macos-signed', 'vitals-linux-x64') | Where-Object { $_ -notin $legs }) {
            $state = if (Test-Path "artefacts/$held") { 'built, kept as a workflow artefact' } else { 'did not build' }
            "- ``$held``: $state; not attached to the release." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          Get-ChildItem publish -File | ForEach-Object { $_.Name }

      # The Android upload key, read only here: after the owner's approval,
      # never in the build job (SEC2-4). APKs get apksigner (v2+v3, what
      # Android verifies); bundles get jarsigner, the signature Play's upload
      # check reads. The key goes to a 0600 file in RUNNER_TEMP and is
      # deleted in the same step, whatever happens. The signing itself is
      # scripts/ci/sign-android.sh, testable locally with a throwaway key:
      # the inline version died silently on v1.0.5 (build-tools 37 renamed
      # apksigner's "Signer #1 certificate" lines and a bare grep exited 1).
      - name: Sign Android APKs and bundles
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret behind $name is not set; refusing to publish unsigned Android builds"; exit 1
            fi
          done
          export SIGN_KEYSTORE="$RUNNER_TEMP/android-upload.jks"
          trap 'rm -f "$SIGN_KEYSTORE"' EXIT
          umask 077
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$SIGN_KEYSTORE"; then
            echo "::error::ANDROID_KEYSTORE_B64 is not valid base64"; exit 1
          fi
          bash scripts/ci/sign-android.sh android-unsigned publish play

      # Bundles are not release assets: Play is the only consumer, and the
      # `play` job takes them from here, signed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: play-bundles
          path: play/*
          if-no-files-found: error
          retention-days: 30

      # Lockfile-verified and with no install scripts: this job is about to
      # hold the updater key, and a dependency's postinstall must not get a
      # chance to tamper with the signer first. Only the Tauri CLI is used.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.plan.outputs.is_release == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.plan.outputs.is_release == 'true'
        with:
          node-version: 24

      - name: Install the Tauri CLI (no scripts)
        if: needs.plan.outputs.is_release == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The minisign signatures the updater checks, made here rather than in
      # the build legs so the key exists only after the owner's approval
      # (SEC-5). `tauri signer sign --app-version` produces exactly what
      # `tauri build` writes with createUpdaterArtifacts: <file>.sig, with
      # the version bound into the signed trusted comment. Signed before
      # Checksums, so the .sig files are summed and attested like any asset.
      - name: Sign updater bundles
        if: needs.plan.outputs.is_release == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is required for a tagged release.' }
          $v = [regex]::Escape($env:VERSION)
          $patterns = @("^Vitals_${v}_(x64|arm64)-setup\.exe$")
          if ($env:PUBLISH_MACOS -eq 'true') { $patterns += "^Vitals_${v}_universal\.app\.tar\.gz$" }
          if ($env:PUBLISH_LINUX -eq 'true') { $patterns += '\.AppImage$' }
          $files = @(Get-ChildItem publish -File | Where-Object { $name = $_.Name; $patterns | Where-Object { $name -match $_ } })
          if ($files.Count -lt 2) { throw "expected at least the two Windows installers to sign, found $($files.Count)" }
          foreach ($f in $files) {
            pnpm --filter @vitals/desktop exec tauri signer sign --app-version $env:VERSION $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "tauri signer sign exited $LASTEXITCODE for $($f.Name)" }
            if (-not (Test-Path "$($f.FullName).sig")) { throw "no signature written beside $($f.Name)" }
            Write-Host "signed $($f.Name)"
          }

      # The manifest the installed app polls.
      - name: Update manifest (latest.json)
        if: needs.plan.outputs.is_release == 'true'
        shell: pwsh
        run: |
          $base = "https://github.com/$env:REPOSITORY/releases/download/$env:TAG"
          function Get-Entry([string]$pattern) {
            $file = Get-ChildItem publish -File | Where-Object { $_.Name -match $pattern } | Select-Object -First 1
            if ($null -eq $file) { throw "no file matching $pattern; latest.json would point at nothing" }
            $sig = "$($file.FullName).sig"
            if (-not (Test-Path $sig)) { throw "no signature beside $($file.Name)" }
            [ordered]@{
              signature = (Get-Content $sig -Raw).Trim()
              url       = "$base/$([uri]::EscapeDataString($file.Name))"
            }
          }

          $v = [regex]::Escape($env:VERSION)
          $platforms = [ordered]@{
            'windows-x86_64'  = Get-Entry "^Vitals_${v}_x64-setup\.exe$"
            'windows-aarch64' = Get-Entry "^Vitals_${v}_arm64-setup\.exe$"
          }
          if ($env:PUBLISH_MACOS -eq 'true') {
            # One universal bundle serves both architectures. The plain
            # darwin-<arch> keys are what the updater asks for by default;
            # darwin-universal is there for a custom target.
            $mac = Get-Entry "^Vitals_${v}_universal\.app\.tar\.gz$"
            $platforms['darwin-universal'] = $mac
            $platforms['darwin-aarch64'] = $mac
            $platforms['darwin-x86_64'] = $mac
          }
          if ($env:PUBLISH_LINUX -eq 'true') {
            $platforms['linux-x86_64'] = Get-Entry '\.AppImage$'
          }

          # `version` without the leading v: it is compared as SemVer against
          # the installed version.
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = "See https://github.com/$env:REPOSITORY/releases/tag/$env:TAG"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = $platforms
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content publish/latest.json -Encoding utf8NoBOM
          Get-Content publish/latest.json

      # Stable names so a website can link to
      # /releases/latest/download/Vitals_x64-setup.exe forever.
      - name: Stable download names
        if: needs.plan.outputs.is_release == 'true'
        shell: pwsh
        run: |
          $stableArgs = @('-Directory', 'publish', '-Version', $env:VERSION)
          if ($env:PUBLISH_MACOS -eq 'true') { $stableArgs += '-MacOS' }
          pwsh -NoProfile -File scripts/stable-assets.ps1 @stableArgs

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem publish -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content publish/SHA256SUMS.txt -Encoding ascii
          Get-Content publish/SHA256SUMS.txt

      # Free, and stronger than a certificate in one respect: it links each
      # file to the exact source and workflow that produced it. Windows does
      # not check it, but a security-conscious user can
      # (`gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: publish/SHA256SUMS.txt

      - name: Attest Rust SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: 'publish/*-setup.exe'
          sbom-path: publish/sbom-rust.cdx.json

      - name: Attest JavaScript SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: 'publish/*-setup.exe'
          sbom-path: publish/sbom-js.cdx.json

      - name: Attest CLI SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: 'publish/vitals-cli_*.zip'
          sbom-path: publish/sbom-cli.cdx.json

      - name: Release notes
        shell: pwsh
        run: |
          $notesArgs = @('-Version', $env:VERSION, '-Tag', $env:TAG, '-Repository', $env:REPOSITORY, '-Out', 'release-notes.md')
          pwsh -NoProfile -File scripts/release-notes.ps1 @notesArgs

      # prerelease is false for betas on purpose. GitHub's /releases/latest/
      # skips pre-releases, and both the updater endpoint
      # (releases/latest/download/latest.json) and the stable download links
      # go through it, so marking a beta pre-release would leave the updater
      # and the website pointing at nothing. The title says "(public beta)"
      # instead.
      - name: Publish release
        # v2.6.2, not v3: v3 fails "create a release" with 403 "Resource not
        # accessible by integration" under the same contents: write token
        # (nightly 36616112094, 2026-09-29; upstream softprops/action-gh-release
        # #836). v2.6.2 is the exact commit the v0.9.0-beta.1 publish used.
        # Dependabot is told to skip v3 in .github/dependabot.yml.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: publish/*
          body_path: release-notes.md
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.title }}
          prerelease: false
          make_latest: 'true'
          # Categorised by .github/release.yml; appended below our notes.
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ── Distribution channels ────────────────────────────────────────────────
  # Tags only, each opt-in with a repo variable, and each skips cleanly —
  # a notice, not a failure — when its secret is absent. Secrets cannot
  # appear in `if:`, so the first step of each job tests the environment
  # and later steps key off its output.

  npm:
    name: npm (@vitals-app/client)
    needs: [plan, publish]
    if: needs.plan.outputs.is_release == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing: the registry trusts this workflow by OIDC,
      # configured on npmjs.com for dragoscv/vitals + release.yml. No token
      # is stored anywhere, and the upload carries a provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5 or later. Pinned, not @latest: this
      # job holds an OIDC token npm trusts to publish as this repository.
      - run: npm install -g npm@11.20.0
      - run: pnpm install --frozen-lockfile
      # Packs the SDK, renames it to its public name (the @vitals scope
      # belongs to another project) and uploads the tarball; prereleases go
      # to the `next` dist-tag. scripts/npm-release.mjs has the why.
      - run: node scripts/npm-release.mjs

  # Track per release: a stable tag (no '-') goes to production, a
  # pre-release tag to internal testing. Production starts as a staged
  # rollout (PLAY_ROLLOUT, default 0.2 = 20 %) so a bad build reaches a fifth
  # of users and can be halted from the Console; raise it there or by a
  # second run. Owner decision 2026-10-14: the service account may release to
  # production (Play Console -> Users and permissions -> vitals-play ->
  # "Release to production"), granted in the Console, not here.
  play:
    name: Google Play
    # Signed bundles come from `publish` (play-bundles), after approval.
    needs: [plan, publish]
    if: needs.plan.outputs.is_release == 'true' && vars.PUBLISH_PLAY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION: ${{ !contains(needs.plan.outputs.version, '-') }}
    permissions:
      contents: read
      # Workload Identity Federation: GitHub's OIDC token is exchanged for a
      # one-hour credential of vitals-play@hai-small-apps. No key exists to
      # leak, and the provider only accepts refs/tags/v* of this repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: apps/android/play/listing
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: play-bundles
          path: play
      # r0adkll/upload-google-play reads release notes from files named
      # whatsnew-<locale>; the listing keeps them in the fastlane layout
      # (<locale>/changelogs/default.txt) that people edit.
      # Each file must fit Play's 500-character limit (Play rejects the
      # whole edit otherwise, after the GitHub release is already public)
      # and must name the version being shipped: a stale "what's new" from
      # the previous release is the mistake this catches (AND-34).
      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p whatsnew
          failed=0
          for dir in apps/android/play/listing/*/; do
            locale=$(basename "$dir")
            if [ -f "$dir/changelogs/default.txt" ]; then
              chars=$(LC_ALL=C.UTF-8 wc -m < "$dir/changelogs/default.txt")
              if [ "$chars" -gt 500 ]; then
                echo "::error file=$dir/changelogs/default.txt::$locale release notes are $chars characters; Google Play allows 500"
                failed=1
              fi
              if ! grep -qF "$VERSION" "$dir/changelogs/default.txt"; then
                echo "::error file=$dir/changelogs/default.txt::$locale release notes do not mention $VERSION; update them for this release"
                failed=1
              fi
              cp "$dir/changelogs/default.txt" "whatsnew/whatsnew-$locale"
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          ls -l whatsnew
          test -n "$(ls whatsnew)" || { echo "no release notes found"; exit 1; }
      - name: Track
        id: track
        shell: bash
        env:
          ROLLOUT: ${{ vars.PLAY_ROLLOUT || '0.2' }}
          # Until the app's first production release has been reviewed, Play
          # calls it a draft app and accepts only `status: draft` releases
          # ("Staged rollout is not permitted on draft app", v1.0.0 run
          # 38494629401). The release is then sent for review from the
          # Console by hand. Set PLAY_DRAFT_APP to anything but 'true' once
          # the app is live, and stable tags roll out as staged releases.
          # The same variable sets changesNotSentForReview: once a review has
          # been rejected, Play refuses an edit that would send itself for
          # review ("Changes cannot be sent for review automatically", v1.0.2
          # run 38651790017), so the edit is committed and the owner sends it
          # from Publishing overview.
          DRAFT_APP: ${{ vars.PLAY_DRAFT_APP }}
        run: |
          if [ "$PRODUCTION" = "true" ] && [ "$DRAFT_APP" = "true" ]; then
            echo "phone=production" >> "$GITHUB_OUTPUT"
            echo "wear=wear:production" >> "$GITHUB_OUTPUT"
            echo "tv=tv:production" >> "$GITHUB_OUTPUT"
            echo "status=draft" >> "$GITHUB_OUTPUT"
            echo "fraction=" >> "$GITHUB_OUTPUT"
            echo "manual=true" >> "$GITHUB_OUTPUT"
          elif [ "$PRODUCTION" = "true" ]; then
            echo "phone=production" >> "$GITHUB_OUTPUT"
            echo "wear=wear:production" >> "$GITHUB_OUTPUT"
            echo "tv=tv:production" >> "$GITHUB_OUTPUT"
            echo "status=inProgress" >> "$GITHUB_OUTPUT"
            echo "fraction=$ROLLOUT" >> "$GITHUB_OUTPUT"
            echo "manual=false" >> "$GITHUB_OUTPUT"
          else
            echo "phone=internal" >> "$GITHUB_OUTPUT"
            echo "wear=wear:qa" >> "$GITHUB_OUTPUT"
            echo "tv=tv:qa" >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
            echo "fraction=" >> "$GITHUB_OUTPUT"
            echo "manual=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: gcp
        with:
          workload_identity_provider: projects/98856543199/locations/global/workloadIdentityPools/github/providers/vitals
          service_account: vitals-play@hai-small-apps.iam.gserviceaccount.com
          create_credentials_file: true
      # Play answers the same commit two opposite ways depending on the
      # app's review state, and the state is not readable beforehand:
      #   - after a rejected review it refuses an edit that would send
      #     itself for review ("Changes cannot be sent for review
      #     automatically", v1.0.2 run 38651790017): changesNotSentForReview
      #     must be true;
      #   - otherwise it refuses that flag ("Changes are sent for review
      #     automatically ... must not be set", v1.0.4): it must be false.
      # So each upload tries the flag the variables suggest and, only if the
      # commit failed, once more with the opposite. A failed commit leaves
      # nothing behind (the edit is discarded), so the retry re-uploads the
      # same versionCode. Any other error fails both attempts and the job.
      - id: phone
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: app.vitals
          releaseFiles: play/vitals-android.aab
          track: ${{ steps.track.outputs.phone }}
          status: ${{ steps.track.outputs.status }}
          userFraction: ${{ steps.track.outputs.fraction }}
          whatsNewDirectory: whatsnew
          changesNotSentForReview: ${{ steps.track.outputs.manual }}
      - if: steps.phone.outcome == 'failure'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: app.vitals
          releaseFiles: play/vitals-android.aab
          track: ${{ steps.track.outputs.phone }}
          status: ${{ steps.track.outputs.status }}
          userFraction: ${{ steps.track.outputs.fraction }}
          whatsNewDirectory: whatsnew
          changesNotSentForReview: ${{ steps.track.outputs.manual == 'true' && 'false' || 'true' }}
      # Phone and watch share one application id but not one track: Wear OS
      # has its own form-factor track. The API calls internal testing `qa`,
      # and a form-factor track is `<prefix>:<name>`, so this is `wear:qa`
      # (developers.google.com/android-publisher/tracks), not `wear:internal`.
      - id: wear
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: app.vitals
          releaseFiles: play/vitals-wear.aab
          track: ${{ steps.track.outputs.wear }}
          status: ${{ steps.track.outputs.status }}
          userFraction: ${{ steps.track.outputs.fraction }}
          whatsNewDirectory: whatsnew
          changesNotSentForReview: ${{ steps.track.outputs.manual }}
      - if: steps.wear.outcome == 'failure'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: app.vitals
          releaseFiles: play/vitals-wear.aab
          track: ${{ steps.track.outputs.wear }}
          status: ${{ steps.track.outputs.status }}
          userFraction: ${{ steps.track.outputs.fraction }}
          whatsNewDirectory: whatsnew
          changesNotSentForReview: ${{ steps.track.outputs.manual == 'true' && 'false' || 'true' }}
      # Android TV has its own form-factor track too: `tv:qa` is its internal
      # testing, as `wear:qa` is the watch's.
      - id: tv
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: app.vitals
          releaseFiles: play/vitals-tv.aab
          track: ${{ steps.track.outputs.tv }}
          status: ${{ steps.track.outputs.status }}
          userFraction: ${{ steps.track.outputs.fraction }}
          whatsNewDirectory: whatsnew
          changesNotSentForReview: ${{ steps.track.outputs.manual }}
      - if: steps.tv.outcome == 'failure'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: app.vitals
          releaseFiles: play/vitals-tv.aab
          track: ${{ steps.track.outputs.tv }}
          status: ${{ steps.track.outputs.status }}
          userFraction: ${{ steps.track.outputs.fraction }}
          whatsNewDirectory: whatsnew
          changesNotSentForReview: ${{ steps.track.outputs.manual == 'true' && 'false' || 'true' }}
      - name: Summary
        if: always()
        shell: bash
        env:
          PHONE: ${{ steps.phone.outcome }}
          WEAR: ${{ steps.wear.outcome }}
          TV: ${{ steps.tv.outcome }}
          MANUAL: ${{ steps.track.outputs.manual }}
        run: |
          for p in "phone:$PHONE" "wear:$WEAR" "tv:$TV"; do
            name=${p%%:*}; outcome=${p#*:}
            if [ "$outcome" = "failure" ]; then
              echo "::warning::$name: first attempt (changesNotSentForReview=$MANUAL) refused; retried with the opposite flag"
              echo "- Play $name: retried with changesNotSentForReview opposite to $MANUAL" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
  winget:
    name: winget
    needs: [plan, publish]
    if: needs.plan.outputs.is_release == 'true' && vars.PUBLISH_WINGET == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - id: gate
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ok = -not [string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)
          if (-not $ok) { Write-Host '::notice::WINGET_TOKEN not set; skipping winget.' }
          "ok=$($ok.ToString().ToLower())" | Add-Content $env:GITHUB_OUTPUT

      # Updates an existing package only: the first manifest is submitted by
      # hand (packaging/winget/README.md). The regex matches the versioned
      # installers and not the stable-named copies, which carry no version
      # and would give winget two installers per architecture.
      #
      # Komac itself, downloaded by version and SHA-256, rather than
      # vedantmgoyal9/winget-releaser: that action installs Komac through
      # cargo-bins/cargo-binstall@main, an unpinned nested action this
      # repository's SHA-pinning policy refuses (v1.0.0 run 38494629401,
      # "is not allowed"), so the winget job could never start.
      #
      # Komac carries installer fields forward from the previous manifest,
      # and 1.0.0-1.0.3 were published as Scope: machine. Since ADR 0038 the
      # copy winget installs is the per-user one (it updates itself on quit
      # without a UAC prompt), so the manifests are written to a folder,
      # rewritten by winget-user-scope.ps1 and only then submitted.
      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - if: steps.gate.outputs.ok == 'true'
        name: Submit to winget-pkgs (Komac)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          KOMAC_VERSION: '2.16.0'
          KOMAC_SHA256: 'bdc45baf028f750da7519cc8a5f2eab5dfef46dfe88650eeb0d0a9bf51446e4f'
        run: |
          $komac = Join-Path $env:RUNNER_TEMP 'komac.exe'
          Invoke-WebRequest "https://github.com/russellbanks/Komac/releases/download/v$env:KOMAC_VERSION/komac-$env:KOMAC_VERSION-x86_64-pc-windows-msvc.exe" -OutFile $komac
          $hash = (Get-FileHash $komac -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:KOMAC_SHA256) { throw "komac hash $hash does not match the pinned $env:KOMAC_SHA256" }
          $base = "https://github.com/$env:REPOSITORY/releases/download/$env:TAG"
          $urls = @("$base/Vitals_$($env:VERSION)_x64-setup.exe", "$base/Vitals_$($env:VERSION)_arm64-setup.exe")
          $out = Join-Path $env:RUNNER_TEMP 'winget'
          & $komac update Vitals.Vitals --version $env:VERSION --urls @urls --release-notes-url "https://github.com/$env:REPOSITORY/releases/tag/$env:TAG" --output $out --dry-run
          if ($LASTEXITCODE -ne 0) { throw "komac update exited $LASTEXITCODE" }
          $installer = Get-ChildItem $out -Recurse -Filter 'Vitals.Vitals.installer.yaml' | Select-Object -First 1
          if ($null -eq $installer) { throw "komac wrote no installer manifest under $out" }
          & pwsh -NoProfile -File scripts/ci/winget-user-scope.ps1 -Path $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "winget-user-scope exited $LASTEXITCODE" }
          Get-Content $installer.FullName
          & $komac submit $installer.DirectoryName --yes
          if ($LASTEXITCODE -ne 0) { throw "komac submit exited $LASTEXITCODE" }

  scoop:
    name: Scoop bucket
    needs: [plan, publish]
    if: needs.plan.outputs.is_release == 'true' && vars.PUBLISH_SCOOP == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - id: gate
        shell: pwsh
        env:
          SCOOP_DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
        run: |
          $ok = -not [string]::IsNullOrWhiteSpace($env:SCOOP_DEPLOY_KEY)
          if (-not $ok) { Write-Host '::notice::SCOOP_DEPLOY_KEY not set; skipping Scoop.' }
          "ok=$($ok.ToString().ToLower())" | Add-Content $env:GITHUB_OUTPUT

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dragoscv/scoop-vitals
          # A deploy key: write access to the bucket and nothing else, unlike a
          # personal token, which can reach every repository its owner can.
          ssh-key: ${{ secrets.SCOOP_DEPLOY_KEY }}
          path: bucket-repo

      # Hashes come from the published SHA256SUMS.txt, so the bucket names
      # exactly the bytes users download — not a rebuild.
      - name: Render manifest
        if: steps.gate.outputs.ok == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG --repo $env:REPOSITORY --pattern SHA256SUMS.txt --dir sums
          $sums = @{}
          Get-Content sums/SHA256SUMS.txt | ForEach-Object { $h, $n = $_ -split '\s+', 2; $sums[$n.Trim()] = $h }

          $m = Get-Content packaging/scoop/vitals.json -Raw | ConvertFrom-Json
          $m.version = $env:VERSION
          foreach ($pair in @(@('64bit', 'x64'), @('arm64', 'arm64'))) {
            $name = "Vitals_$($env:VERSION)_$($pair[1])-setup.exe"
            if (-not $sums.ContainsKey($name)) { throw "$name is not in SHA256SUMS.txt" }
            $m.architecture.($pair[0]).url = "https://github.com/$env:REPOSITORY/releases/download/$env:TAG/$name#/dl.7z"
            $m.architecture.($pair[0]).hash = $sums[$name]
          }
          New-Item -ItemType Directory -Force -Path bucket-repo/bucket | Out-Null
          $m | ConvertTo-Json -Depth 10 | Set-Content bucket-repo/bucket/vitals.json -Encoding utf8NoBOM
          Get-Content bucket-repo/bucket/vitals.json

      - name: Push
        if: steps.gate.outputs.ok == 'true'
        working-directory: bucket-repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/vitals.json
          if git diff --cached --quiet; then
            echo "bucket already at $VERSION"
            exit 0
          fi
          git commit -m "vitals: update to $VERSION"
          git push

  chocolatey:
    name: Chocolatey
    needs: [plan, publish]
    if: needs.plan.outputs.is_release == 'true' && vars.PUBLISH_CHOCO == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - id: gate
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $ok = -not [string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)
          if (-not $ok) { Write-Host '::notice::CHOCO_API_KEY not set; skipping Chocolatey.' }
          "ok=$($ok.ToString().ToLower())" | Add-Content $env:GITHUB_OUTPUT

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pack
        if: steps.gate.outputs.ok == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG --repo $env:REPOSITORY --pattern SHA256SUMS.txt --dir sums
          $sums = @{}
          Get-Content sums/SHA256SUMS.txt | ForEach-Object { $h, $n = $_ -split '\s+', 2; $sums[$n.Trim()] = $h }
          $x64 = "Vitals_$($env:VERSION)_x64-setup.exe"
          $arm = "Vitals_$($env:VERSION)_arm64-setup.exe"
          foreach ($n in $x64, $arm) { if (-not $sums.ContainsKey($n)) { throw "$n is not in SHA256SUMS.txt" } }

          # Work on a copy so the templates in the tree keep their
          # placeholders.
          Copy-Item packaging/chocolatey -Destination choco -Recurse
          $install = (Resolve-Path 'choco/tools/chocolateyinstall.ps1').Path
          $text = [IO.File]::ReadAllText($install)
          $text = $text.Replace('__URL64__', "https://github.com/$env:REPOSITORY/releases/download/$env:TAG/$x64")
          $text = $text.Replace('__CHECKSUM64__', $sums[$x64])
          $text = $text.Replace('__URLARM64__', "https://github.com/$env:REPOSITORY/releases/download/$env:TAG/$arm")
          $text = $text.Replace('__CHECKSUMARM64__', $sums[$arm])
          [IO.File]::WriteAllText($install, $text)

          # Chocolatey's package versions predate SemVer 2: a pre-release
          # label may not contain dots, so 0.9.0-beta.1 is packed as
          # 0.9.0-beta1. It still sorts correctly against later betas.
          $parts = $env:VERSION -split '-', 2
          $chocoVersion = if ($parts.Count -eq 2) { "$($parts[0])-$($parts[1] -replace '\.', '')" } else { $parts[0] }
          choco pack choco/vitals.nuspec --version $chocoVersion --outputdirectory out
          if ($LASTEXITCODE -ne 0) { throw "choco pack exited $LASTEXITCODE" }
          Get-ChildItem out

      - name: Push
        if: steps.gate.outputs.ok == 'true'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $pkg = Get-ChildItem out -Filter '*.nupkg' | Select-Object -First 1
          $log = choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $log
          if ($code -eq 0) { return }
          # While an earlier version still waits in Chocolatey's human
          # moderation (1.0.0 since 2026-10-14), every later push is refused
          # with a bare "403 (Forbidden)" (v1.0.4 run 39074169746), and the
          # message says nothing more. That is the community repository's
          # queue, not a broken package, and the release is public everywhere
          # else: when the feed shows NO approved version of `vitals` yet,
          # the 403 is the queue, so warn loudly and keep the run green
          # (QA2-6). With an approved version on the feed a 403 means a bad
          # key or a real refusal, and the job fails as before.
          $approved = $null
          try {
            $feed = Invoke-RestMethod -Uri "https://community.chocolatey.org/api/v2/FindPackagesById()?id='vitals'" -TimeoutSec 30
            $approved = @($feed | Where-Object { $_.properties.IsApproved.'#text' -eq 'true' -or $_.properties.PackageStatus -eq 'Approved' }).Count
          } catch { Write-Host "could not read the Chocolatey feed: $_" }
          if ($log -match '403' -and $approved -eq 0) {
            $msg = "Chocolatey refused $($pkg.Name) with 403 and no version of vitals is approved yet: the first version is still in moderation. Rerun this job once community.chocolatey.org approves it."
            Write-Host "::warning::$msg"
            "- Chocolatey: $msg" | Add-Content $env:GITHUB_STEP_SUMMARY
            return
          }
          throw "choco push exited $code"
