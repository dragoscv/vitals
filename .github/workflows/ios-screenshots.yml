name: iOS screenshots

# App Store screenshots of the iPhone app: real Simulator captures of the
# labelled Sample PC, EN + RO, 6.9". On a hosted Apple-silicon runner because
# the devcloud Mac has no GPU and iOS 26 then draws the glass tab bar with
# only its selected item (ADR 0041). Manual: run it before a store
# submission, download the artefact, upload to App Store Connect.
on:
  workflow_dispatch:
  # Also when the iPhone UI changes, so a reviewer sees the screens the
  # change produced (free on a public repository).
  pull_request:
    paths:
      - 'apps/ios/Vitals/**'
      - 'apps/ios/scripts/screenshots.sh'
      - '.github/workflows/ios-screenshots.yml'

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Capture
        run: bash apps/ios/scripts/build.sh screenshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-screenshots
          path: apps/ios/build/screenshots/**
          if-no-files-found: error
          retention-days: 30
