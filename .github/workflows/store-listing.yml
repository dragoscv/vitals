name: Store listing

# A released version is not a listed app, and a listed app is not one everyone
# can get. On 2026-11-18 the iPhone app had two versions READY_FOR_SALE and no
# availability record at all: App Store Connect read "This app was removed from
# sale from the App Store", the product page 404'd and
# `itunes.apple.com/lookup` returned resultCount 0 — for weeks and unnoticed.
# On 2026-11-19 the Play production rollout was raised from 20 % to 100 % by
# hand and the repository could not tell either: a release left at 20 % reaches
# a fifth of users while every gate stays green.
#
# This runs the probe on every push to main, weekly, and on demand. It uploads
# nothing: it reads one App Store Connect record, the Play production track's
# release state (through an edit it discards immediately), three public
# storefront pages and the public lookup. docs/releasing.md, "Store steps no
# pipeline can prove".
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 06:17 UTC: the weekend's store processing has settled, and it is
    # before the week's own releases.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  # The Play half reads the production track as `vitals-play` through Workload
  # Identity Federation (S24-21), so the long-lived service-account key that
  # used to sit in a repository secret can be revoked. The provider admits this
  # one workflow file on `main`, and tags — not `main` in general — so no other
  # job on this branch can mint a token for a production release.
  id-token: write

concurrency:
  # One probe at a time: it reads a public endpoint that rate-limits.
  group: store-listing
  cancel-in-progress: false

jobs:
  listing:
    name: App is for sale
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The App Store Connect key was a `release`-environment secret, and that
    # environment requires an owner approval (SEC-5), so a job that declared it
    # would pause on a pending deployment instead of checking anything. The same
    # three values are repository-level secrets now, under the names the shared
    # client derives from the gcloud secrets (apple-asc-key-id → APPLE_ASC_KEY_ID
    # and so on); that is what makes an unattended run possible at all. They are
    # job-level so a step's `if` can see them — GitHub forbids `secrets` in an
    # `if` expression.
    env:
      APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
      APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      APPLE_ASC_ISSUER: ${{ secrets.APPLE_ASC_ISSUER }}
      APPLE_SECRETS_PROJECT: ${{ vars.APPLE_SECRETS_PROJECT || 'dragos-devcloud' }}
      BRIVIO_API_KEY: ${{ secrets.BRIVIO_API_KEY }}
      STORE_ALERT_TO: ${{ vars.STORE_ALERT_TO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The script imports nothing, so this is the only setup it needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # The Play half of the same question, and no longer a stored key: the
      # identity is `vitals-play` through Workload Identity Federation, so the
      # credential exists only for the length of this job. The provider's
      # attribute condition admits `refs/heads/main` **for this workflow file
      # only** (and every `refs/tags/v`), which is what keeps the federation
      # from becoming a production-release credential for anything that runs on
      # `main` — see docs/releasing.md, S24-21.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: gcp
        with:
          workload_identity_provider: projects/98856543199/locations/global/workloadIdentityPools/github/providers/vitals
          service_account: vitals-play@hai-small-apps.iam.gserviceaccount.com
          token_format: access_token
          # Not the action's `cloud-platform` default: the Play API answers
          # `403 Request had insufficient authentication scopes` for that, the
          # same trap a local ADC login hits (see scripts/play-rollout.mjs).
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # Absent credentials are a SKIPPED inside the script, which is right for a
      # repository that has none. Here it is not: a check that skips every week
      # looks green while proving nothing, and the whole point of this workflow
      # is that the failure of 2026-11-18 went unnoticed. So it fails instead.
      - name: App Store Connect credentials exist
        if: env.APPLE_ASC_KEY_P8 == ''
        run: |
          echo "::error::APPLE_ASC_KEY_P8 is not set at repository level, so the store-listing check cannot run and this job proves nothing. Add the three APPLE_ASC_* secrets (see docs/releasing.md); the values are the gcloud secrets apple-asc-key-p8 / -key-id / -issuer."
          exit 1

      # The same argument for the federated half: without this, a provider
      # condition that stopped admitting this workflow would make the rollout
      # print SKIPPED while the job stayed green — which is the exact shape of
      # the 2026-11-19 miss, a release reaching a fifth of users with every gate
      # reading fine.
      - name: Google Play credentials exist
        if: steps.gcp.outputs.access_token == ''
        run: |
          echo "::error::the Workload Identity Federation exchange produced no access token, so the Play production-rollout half cannot run and this job would pass while proving nothing. Check that the provider's attribute condition still admits this workflow file (gcloud iam workload-identity-pools providers describe vitals --workload-identity-pool=github --location=global --project=hai-small-apps)."
          exit 1

      # --require-full-rollout: a staged production rollout — the state every
      # stable tag starts in — must not read as "everything is fine". It turns
      # a 20 % rollout into a failure here and into a warning on a bare run. A
      # pre-release (a version with a SemVer pre-release suffix) is exempt: a
      # partial fraction is its intended state, not an unfinished release. The
      # script also appends the observed versionCodes, status and userFraction to
      # $GITHUB_STEP_SUMMARY, so the "at 100 %" claim is a value on the run
      # itself rather than a line someone has to find in a log.
      #
      # --require-credentials: the flag that makes this job unable to pass by
      # skipping. Without it, a half that found no credential prints SKIPPED and
      # decides nothing about the exit code — which is exactly how a release's
      # own gate read "the Play rollout is at 100 %" off a line that skipped its
      # subject. Here both credentials exist (the two guards above proved it), so
      # a skip is a failure. The log is kept for the guard that follows.
      - name: The app is for sale, and reaches everyone
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          node scripts/check-store-listing.mjs \
            --fail-on-unlisted --require-full-rollout --require-credentials \
            2>&1 | tee "$RUNNER_TEMP/store-listing.log"

      # The house pattern from mqtt.yml's "The broker test ran rather than
      # skipping": a skip here would mean the job proved nothing while staying
      # green. `--require-credentials` makes the script fail on its own skip
      # path; this checks the same thing from OUTSIDE the script, so a call site
      # that drops the flag — or a credential the script's own predicate rejects
      # while the workflow's step-level guard accepted it — cannot slip a
      # SKIPPED line past the job. Runs even when the step above failed, so the
      # reason is printed rather than swallowed.
      - name: Every half of the check ran rather than skipping
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/store-listing.log"
          if [ ! -f "$log" ]; then
            echo "::error::the store-listing check produced no log, so this job cannot prove that anything ran"
            exit 1
          fi
          if grep -q '^SKIPPED:' "$log"; then
            echo "::error::the store-listing check skipped a half, so this job proved nothing; the authoritative workflow is store-listing.yml and it must not pass by skipping:"
            grep '^SKIPPED:' "$log"
            exit 1
          fi

      # The other half of the same question. "Is the app for sale" and "is
      # everything a submission needs actually there" were two workflows for
      # one afternoon's incident; they run in one job, on one schedule, so a
      # week's silence cannot mean one of them stopped.
      #
      # `--all` audits both records, but only the iPhone one decides the exit
      # code: the Mac app is not on the Mac App Store by decision (D6), so its
      # gaps are reported and never fail.
      - name: Every record a submission needs is present
        run: |
          set -euo pipefail
          node scripts/ios-store.mjs --check --all --json | tee "$RUNNER_TEMP/store-completeness.json"

      # GitHub's failure notice reaches whoever watches the repository, which is
      # not the same as the person who has to fix an App Store listing. Brivio is
      # the mail platform (POST /v1/email/send, scope emails:send). Inert until
      # BRIVIO_API_KEY and STORE_ALERT_TO exist, and named here so that is
      # visible rather than assumed.
      - name: Mail the owner when the guard fails
        if: failure() && env.BRIVIO_API_KEY != '' && env.STORE_ALERT_TO != ''
        env:
          BRIVIO_API_URL: ${{ vars.BRIVIO_API_URL || 'https://api.brivio.ro' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/alert.json" <<JSON
          {"to":["$STORE_ALERT_TO"],"category":"alert","subject":"Vitals: the App Store listing check failed","text":"The store-listing guard failed, so the app may not be installable: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
          curl -sS --fail-with-body -X POST "$BRIVIO_API_URL/v1/email/send" \
            -H "Authorization: Bearer $BRIVIO_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/alert.json"
