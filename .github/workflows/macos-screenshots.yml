name: Mac App Store screenshots

# Real captures of the Mac App Store flavour (sandbox-reduced, no updater)
# on a hosted runner, EN + RO. The devcloud Mac has no GPU and no console
# session, so it cannot capture a window (ADR 0041). Manual before a store
# submission: download the artefact, upload with
# scripts/macos-screenshots-upload.mjs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/macos/appstore-screenshots.sh'
      - '.github/workflows/macos-screenshots.yml'

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # rust-toolchain.toml
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: macos-shots
          cache-on-failure: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Capture
        run: bash scripts/macos/appstore-screenshots.sh build/macos-screenshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-screenshots
          path: build/macos-screenshots/**
          if-no-files-found: error
          retention-days: 30
