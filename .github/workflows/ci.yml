name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  # A newer push makes an in-flight run irrelevant. Cancelling keeps queue
  # times short, which is what keeps people actually reading CI results.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target; Linux runs to keep the OS-agnostic
        # core honest. A core crate that only compiles on Windows means the
        # trait boundary has leaked, and we want to know immediately.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # First, because it takes two seconds and catches contract drift that
      # a four-minute compile never would: serde casing that disagrees with
      # the generated TypeScript, an invoke() with no command behind it, a
      # locale key present in one language only.
      # GitHub's runners do not ship ripgrep; the drift script needs it.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Windows'
        with:
          tool: ripgrep

      - name: Contract drift
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-drift.ps1

      # Informational: prints the version every manifest carries, so a
      # disagreement is visible here long before release.yml's
      # `version.ps1 -Check <tag>` refuses the tag over it.
      - name: Versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/version.ps1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # vitals-win is `#![cfg(windows)]`: on Linux its library is empty and
      # its twenty probe examples, which exist to be run against a real
      # Windows machine, cannot compile. This leg's job is to prove every
      # OTHER crate — the OS-agnostic core above all — builds without
      # Windows, so it checks everything but those examples; the Windows
      # leg above covers them.
      - name: Clippy (without Windows-only examples)
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --lib --bins --tests --benches --exclude vitals-win -- -D warnings

      - name: Test
        if: runner.os == 'Windows'
        run: cargo test --workspace

      - name: Test (without Windows-only examples)
        if: runner.os != 'Windows'
        run: cargo test --workspace --lib --bins --tests --exclude vitals-win

      # A release build is required: the debug build is several times slower
      # and would measure the compiler's lack of optimisation rather than
      # our own code. Windows only, since the budget covers the Windows
      # sampler.
      - name: Performance budget
        if: runner.os == 'Windows'
        run: cargo test -p vitals-win --release --test overhead -- --nocapture

      # Tests marked `#[ignore]` are the ones too expensive to run on every
      # `cargo test` — they allocate the real 512 MB working set and assert
      # that a dependent load actually reaches DRAM. They still have to run
      # somewhere, or the assertion they carry is decorative. Release, because
      # the figures only mean anything in an optimised build.
      - name: Expensive tests
        if: runner.os == 'Windows'
        run: cargo test --workspace --release -- --ignored

  bindings:
    name: Generated bindings are current
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate TypeScript bindings
        run: cargo test -p vitals-core --features ts

      # The whole point of generating types: if the Rust model changed without
      # the committed TypeScript being regenerated, the two sides of the IPC
      # boundary have drifted and the build must go red.
      - name: Fail if bindings drifted
        run: git diff --exit-code -- packages/protocol/src/generated

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # The bundle is the one input `check-size.ps1` needs; the installer is
      # measured by the build job below, which is the only place it exists.
      - name: Build frontend
        run: pnpm --filter @vitals/desktop build:vite

      - name: Size budget (bundle)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-size.ps1 -SkipInstaller

  audit:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # A prebuilt binary, not `rustsec/audit-check`, which compiles
      # cargo-audit from source on every run — measured at 189 s of a 190 s
      # job elsewhere. This takes about ten seconds.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --deny warnings

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level high

      # MIT and Apache-2.0 require their notices to ship with the binary. A
      # dependency bump that forgets to regenerate the file fails here. In
      # this job because it is the one with both cargo and pnpm.
      - name: Third-party notices are current
        shell: pwsh
        run: pwsh -NoProfile -File scripts/third-party-notices.ps1 -Check

  build:
    name: Build installer
    runs-on: windows-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @vitals/desktop build

      # Size is a feature here, and it regresses one careless import at a
      # time. The budgets live in size-budget.json so a deliberate increase
      # is a reviewable diff rather than a number nobody sees.
      - name: Size budget
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-size.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: vitals-installer
          # The workspace target directory is at the repo root, not under
          # src-tauri — a Cargo workspace shares one. The old path here never
          # existed, and `if-no-files-found: error` meant this step could
          # only ever fail.
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
