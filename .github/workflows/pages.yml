name: Pages

# Builds the website in apps/site and publishes it to GitHub Pages, served at
# https://vitals.dragoscatalin.ro (the domain comes from apps/site/public/CNAME).
# Only site changes trigger it: a Rust or desktop change has nothing to publish.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but an
# in-progress deployment is allowed to finish rather than leave Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # The trailing `...` installs the site and its workspace dependencies
      # only, not the desktop app's toolchain.
      - name: Install
        run: pnpm install --frozen-lockfile --filter @vitals/site...

      - name: Build
        run: pnpm --filter @vitals/site build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
