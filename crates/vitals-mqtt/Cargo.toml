[package]
name = "vitals-mqtt"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Publishes Vitals to an MQTT broker with Home Assistant discovery."

[dependencies]
vitals-core = { workspace = true }
rumqttc = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# The broker test in `tests/broker.rs` stands a second client in for Home
# Assistant, so it needs the client crate and JSON directly, and a machine to
# publish from: `fixtures` is off for the library so it can never reach a
# release binary, and on here.
rumqttc = { workspace = true }
serde_json = { workspace = true }
vitals-core = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
