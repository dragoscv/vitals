[package]
name = "vitals-ipc"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared-memory ring buffer and named-pipe protocol between the UI, sampler and helper."

[dependencies]
vitals-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
interprocess = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The SDDL string for the pipe's security descriptor; interprocess takes a
# `U16CStr` and already depends on this crate, so it adds nothing to the build.
widestring = "1.2.1"

[dev-dependencies]
vitals-core = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
