[package]
name = "vitals-win"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Windows platform backend."

[dependencies]
vitals-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Pipe contract and client of the optional CPU sensors service.
vitals-sensors = { workspace = true }
windows = { version = "0.62.2", features = [
	"Win32_Foundation",
	"Win32_System_Threading",
	"Win32_System_ProcessStatus",
	"Win32_System_SystemInformation",
	"Win32_System_Performance",
	# nvml.dll from System32, for NVIDIA temperature, fan and power (sensors::nvml).
	"Win32_System_LibraryLoader",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Memory",
	"Win32_System_Power",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_RemoteDesktop",
	"Win32_System_Registry",
	"Win32_System_TaskScheduler",
	"Win32_System_Com",
	# URLDownloadToFileW for the pinned PawnIO installer (sensors::cpu_service).
	"Win32_System_Com_Urlmon",
	"Win32_System_Ole",
	"Win32_System_Variant",
	# Hardware inventory (hardware/): Win32_Processor, Win32_PhysicalMemory, MSFT_PhysicalDisk.
	"Win32_System_Wmi",
	# Device Manager list (devices/): SetupDi, CM_Get_DevNode_Status, DEVPKEY properties.
	"Win32_Devices_DeviceAndDriverInstallation",
	"Win32_Devices_Properties",
	# Drive temperature (hardware/drive_temp): IOCTL_STORAGE_QUERY_PROPERTY.
	"Win32_System_IO",
	"Win32_System_Ioctl",
	# Adapter names and dedicated VRAM for devices the D3DKMT registry query
	# does not name (virtual displays, render-only adapters).
	"Win32_Graphics_Dxgi",
	"Wdk_System_SystemInformation",
	"Wdk_System_SystemServices",
	"Wdk_System_Threading",
	# Storage review basket (storage/recycle): IFileOperation to the Recycle
	# Bin, known folders for the protected list, and Restart Manager for
	# "which program has this open".
	"Win32_UI_Shell",
	"Win32_System_RestartManager",
	# MSIX startup tasks (startup_task.rs): the Store build starts at logon
	# through the package manifest, because its Run-key writes are virtualised.
	"ApplicationModel",
	"ApplicationModel_Activation",
] }
# `#[implement]` (the IFileOperation progress sink) expands to
# `::windows_core::` paths, so the crate must be a direct dependency. Same
# version `windows` already pulls in; nothing new is downloaded.
windows-core = "0.62.2"
# Process icons (process/icon.rs) go to the webview as PNG data URLs. Both
# versions are already in the lock through tauri; nothing new is downloaded.
png = "0.18.1"
base64 = "0.23.1"
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_System_Memory",
	"Win32_System_ProcessStatus",
	"Win32_System_SystemServices",
	"Win32_System_Threading",
	"Win32_System_SystemInformation",
	"Win32_Storage_FileSystem",
	# Volume activity counters and media kind: DeviceIoControl lives in
	# System_IO, the DISK_PERFORMANCE / STORAGE_* structs in System_Ioctl.
	"Win32_System_IO",
	"Win32_System_Ioctl",
	# Explorer reveal and the Properties dialog. `Win32_System_Registry` is
	# not used directly: SHELLEXECUTEINFOW carries an HKEY field, so the
	# struct only exists when that feature is on.
	"Win32_UI_Shell",
	"Win32_UI_Shell_Common",
	"Win32_UI_WindowsAndMessaging",
	# Process icons: GetIconInfo/GetDIBits read an HICON's pixels.
	"Win32_Graphics_Gdi",
	"Win32_System_Registry",
	# Task Manager replacement: the real taskmgr is started as a debuggee to
	# bypass the IFEO hook that would otherwise relaunch us.
	"Win32_System_Diagnostics_Debug",
	# `RegCreateKeyExW` and `CreateProcessW` take SECURITY_ATTRIBUTES, which
	# only exists when this is on.
	"Win32_Security",
	# `GetCurrentPackageFullName`: the Store (MSIX) build switches off what
	# Store policy forbids, at run time, from the same binary.
	"Win32_Storage_Packaging_Appx",
] }

[lints]
workspace = true

[dev-dependencies]
# Used to prove the delta encoding actually reduces payload size.
serde_json = { workspace = true }
