[package]
name = "vitals-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Windows platform backend."

[dependencies]
vitals-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
	"Win32_Foundation",
	"Win32_System_Threading",
	"Win32_System_ProcessStatus",
	"Win32_System_SystemInformation",
	"Win32_System_Performance",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Memory",
	"Win32_System_Power",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_RemoteDesktop",
	"Win32_System_Registry",
	"Win32_System_TaskScheduler",
	"Win32_System_Com",
	"Win32_System_Ole",
	"Win32_System_Variant",
	"Wdk_System_SystemInformation",
	"Wdk_System_SystemServices",
	"Wdk_System_Threading",
] }
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_System_Memory",
	"Win32_System_ProcessStatus",
	"Win32_System_SystemServices",
	"Win32_System_Threading",
	"Win32_System_SystemInformation",
	"Win32_Storage_FileSystem",
	# Explorer reveal and the Properties dialog. `Win32_System_Registry` is
	# not used directly: SHELLEXECUTEINFOW carries an HKEY field, so the
	# struct only exists when that feature is on.
	"Win32_UI_Shell",
	"Win32_UI_Shell_Common",
	"Win32_UI_WindowsAndMessaging",
	"Win32_System_Registry",
	# Task Manager replacement: the real taskmgr is started as a debuggee to
	# bypass the IFEO hook that would otherwise relaunch us.
	"Win32_System_Diagnostics_Debug",
	# `RegCreateKeyExW` and `CreateProcessW` take SECURITY_ATTRIBUTES, which
	# only exists when this is on.
	"Win32_Security",
] }

[lints]
workspace = true

[dev-dependencies]
# Used to prove the delta encoding actually reduces payload size.
serde_json = { workspace = true }
