# git-cliff configuration — a DRAFTING aid, not the changelog.
#
# CHANGELOG.md is hand-curated: it is written for someone whose computer is
# slow, not for someone reading commit subjects, and a generated list of
# "fix(performance): chart the selected adapter" lines is not that. Use this
# to see what landed since the last tag, then write the entry by hand:
#
#   git cliff --unreleased --strip header      # everything since the last tag
#   git cliff v0.9.0-beta.1..HEAD              # a specific range
#
# Never pipe its output into CHANGELOG.md.

[changelog]
header = """
# Changelog

All notable changes to Vitals are recorded here.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Non-conventional commits still appear, under "Other", so a draft never
# silently omits work.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
# The moving nightly tag is not a version.
skip_tags = "nightly"
sort_commits = "oldest"

# Keep a Changelog's sections. The HTML comments only fix the order; they
# are stripped from the heading by `striptags`.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { body = ".*security", group = "<!-- 4 -->Security" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 6 -->Other" },
  { message = "^(chore|ci|build|test|style)", group = "<!-- 6 -->Other" },
  { message = ".*", group = "<!-- 6 -->Other" },
]
